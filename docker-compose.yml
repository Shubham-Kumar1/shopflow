version: "3.9"

services:
  # ── Infrastructure ────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: shopflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow123
      POSTGRES_MULTIPLE_DATABASES: users_db,orders_db,payments_db
    volumes:
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopflow-network

  mongodb:
    image: mongo:6-jammy
    container_name: shopflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-shopflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-shopflow123}
      MONGO_INITDB_DATABASE: products_db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopflow-network

  redis:
    image: redis:7-alpine
    container_name: shopflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopflow-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: shopflow-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - shopflow-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: shopflow-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - shopflow-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopflow-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shopflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - shopflow-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: shopflow-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shopflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-shopflow123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopflow-network

  # ── Application Services ──────────────────────────────────────────

  api-gateway:
    build: ./services/api-gateway
    container_name: shopflow-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      USER_SERVICE_URL: http://user-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      ORDER_SERVICE_URL: http://order-service:4003
      PAYMENT_SERVICE_URL: http://payment-service:4004
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - shopflow-network

  user-service:
    build: ./services/user-service
    container_name: shopflow-user-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://shopflow:shopflow123@postgres:5432/users_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopflow-network

  product-service:
    build: ./services/product-service
    container_name: shopflow-product-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      MONGODB_URI: mongodb://shopflow:shopflow123@mongodb:27017/products_db?authSource=admin
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopflow-network

  order-service:
    build: ./services/order-service
    container_name: shopflow-order-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://shopflow:shopflow123@postgres:5432/orders_db
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - shopflow-network

  payment-service:
    build: ./services/payment-service
    container_name: shopflow-payment-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      DATABASE_URL: postgresql://shopflow:shopflow123@postgres:5432/payments_db
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_URL: amqp://shopflow:shopflow123@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - shopflow-network

  notification-service:
    build: ./services/notification-service
    container_name: shopflow-notification-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      PORT: 4005
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_URL: amqp://shopflow:shopflow123@rabbitmq:5672
    depends_on:
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - shopflow-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  zookeeper_data:
  rabbitmq_data:

networks:
  shopflow-network:
    driver: bridge
